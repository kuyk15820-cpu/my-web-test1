name: Build Repo UI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm' # เพิ่ม Caching ช่วยให้ npm install ครั้งต่อไปไวขึ้นมาก

      - name: Install Dependencies
        run: |
          npm ci
          npm install -D lightningcss  # การันตีว่า Binary ของ lightningcss บน Linux ubuntu ถูกลงถูกต้อง

      - name: Build Project
        run: npm run build

      - name: Deploy Build to Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: build-output
          force_orphan: true
